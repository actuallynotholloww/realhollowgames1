<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disclaimer</title>
    <script>
        // Check if the user has already seen the disclaimer
        if (localStorage.getItem("seenDisclaimer") === "true") {
            window.location.href = "hollow.html";
        }

        function proceedToHollow() {
            // Save that the user has seen the disclaimer
            localStorage.setItem("seenDisclaimer", "true");
            // Redirect to hollow.html
            window.location.href = "hollow.html";
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .disclaimer-box {
            background-color: #2b2b2b;
            padding: 30px;
            border-radius: 8px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        h2 {
            color: #ff4757;
            margin-top: 0;
        }
        p {
            line-height: 1.6;
            margin-bottom: 20px;
        }
        button {
            background-color: #2ed573;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #7bed9f;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="disclaimer-box">
        <h2>Disclaimer</h2>
        <p>The spin the wheel was broken, but it's fixed now. Anyone who won the Mythic Verity in the last 2 hours doesn't count.</p>
        <button onclick="proceedToHollow()">Go to Hollow Games</button>
    </div>

</body>
</html>
