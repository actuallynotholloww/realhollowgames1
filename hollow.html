<!DOCTYPE html>
<html>
<head>
<title>Clever-Portal</title>
<link type="image/x-icon" rel="icon" href="img/hollow.png">
<link rel="stylesheet" href="assets/new.min.css">
<style>
html, body {
transition: .5s;
}

/*Override max width of body set in new.css*/
body {
 max-width: 1000px;
}

.secret-activation {
position: fixed;
inset: 0;
z-index: 2000;
display: none;
align-items: center;
justify-content: center;
overflow: hidden;
background: radial-gradient(circle at center, rgba(22, 62, 36, 0.32), #000 68%);
}

.secret-activation.active {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 4vh;
animation: activation-screen-in 0.25s ease-out both;
}

.secret-activation-title {
position: relative;
z-index: 2;
flex: 0 0 auto;
margin: 0;
color: #65ff8f;
font: 900 clamp(2rem, 8vw, 5rem)/1 monospace;
letter-spacing: 0.04em;
text-shadow: 0 0 12px rgba(101, 255, 143, 0.7);
}

.secret-activation.active:not(.show-terminal) .secret-activation-title {
position: fixed;
top: 0;
left: 0;
will-change: transform, filter, clip-path;
animation: activation-title-flicker 0.8s steps(2, end) infinite;
filter: var(--glitch-filter, none);
clip-path: var(--glitch-clip, inset(0));
}

.secret-activation.show-terminal {
align-items: flex-start;
justify-content: flex-start;
padding: 3vh 4vw;
}

.secret-activation.active.show-terminal {
inset: 0;
animation: none;
}

.secret-activation.short-mode {
background: #000;
}

.secret-activation.active.item-unlock-mode {
animation: none;
}

.secret-activation.active.short-mode:not(.show-terminal)::before,
.secret-activation.active.short-mode:not(.show-terminal)::after,
.secret-activation.short-mode .secret-activation-title::before,
.secret-activation.short-mode .secret-activation-title::after {
display: none;
}

.secret-activation.active.short-mode:not(.show-terminal) .secret-activation-title {
position: relative;
top: auto;
left: auto;
animation: none;
filter: none;
clip-path: none;
transform: none;
}

.secret-activation.active.short-mode .secret-activation-title.item-code-fade {
animation: item-code-fade-out 0.7s ease-out both;
}

.secret-activation.item-unlock-shaking {
animation: none;
}

.item-unlock-title {
position: absolute;
top: 42%;
left: 50%;
z-index: 2;
margin: 0;
color: #65ff8f;
font: 900 clamp(2.5rem, 12vw, 8rem)/1 monospace;
letter-spacing: 0.06em;
text-align: center;
text-shadow: 0 0 18px rgba(101, 255, 143, 0.95), 0 0 48px rgba(101, 255, 143, 0.65);
}

.item-reveal-stage {
position: absolute;
inset: 0;
z-index: 2;
pointer-events: none;
}

.item-reveal-stage[hidden] {
display: none;
}

.item-unlock-title.boom-in {
animation: item-title-boom 0.65s cubic-bezier(0.16, 1.4, 0.3, 1) both;
}

.item-unlock-title.pan-up {
animation: item-title-pan-up 1.8s ease-in-out both;
}

.item-reward.reveal {
animation: item-reward-fade-in 1.8s ease-out both;
}

.item-reward-image.rarity-glow {
animation: item-rarity-glow 1s ease-out 1.6s both;
}

@keyframes item-rarity-glow {
0%, 100% { filter: drop-shadow(0 0 0 transparent); }
18% { filter: drop-shadow(0 0 9px var(--rarity-glow)) drop-shadow(0 0 20px var(--rarity-glow)); }
42% { filter: drop-shadow(0 0 15px var(--rarity-glow)) drop-shadow(0 0 30px var(--rarity-glow)); }
}

.secret-activation.glitch-out {
animation: activation-glitch-exit 1.4s steps(2, end) both;
background: #000;
}

.secret-activation.glitch-out.handoff-flash {
background: #0000ff;
}

.secret-activation.active:not(.show-terminal)::before,
.secret-activation.active:not(.show-terminal)::after,
.secret-activation.glitch-out::before,
.secret-activation.glitch-out::after {
position: absolute;
inset: -10%;
z-index: 3;
content: "";
pointer-events: none;
}

.secret-activation.active:not(.show-terminal)::before,
.secret-activation.glitch-out::before {
background: repeating-linear-gradient(0deg, transparent 0 5px, rgba(56, 232, 255, 0.85) 6px 8px, transparent 9px 14px);
mix-blend-mode: screen;
animation: activation-glitch-slices 0.09s steps(2, end) infinite;
}

.secret-activation.active:not(.show-terminal)::after,
.secret-activation.glitch-out::after {
background: repeating-linear-gradient(0deg, transparent 0 9px, rgba(255, 60, 158, 0.8) 10px 13px, transparent 14px 20px);
mix-blend-mode: screen;
animation: activation-glitch-slices 0.07s steps(2, end) infinite reverse;
}

.secret-activation.glitch-out::before {
background:
  linear-gradient(0deg, transparent 0 12%, rgba(56, 232, 255, 0.95) 12.5% 14%, transparent 14.5% 36%, rgba(56, 232, 255, 0.65) 36.5% 40%, transparent 40.5% 74%, rgba(56, 232, 255, 0.8) 74.5% 77%, transparent 77.5%),
  repeating-linear-gradient(0deg, transparent 0 4px, rgba(56, 232, 255, 0.85) 5px 7px, transparent 8px 13px);
animation: activation-out-cyan 0.16s steps(2, end) infinite;
}

.secret-activation.glitch-out::after {
background:
  linear-gradient(0deg, transparent 0 21%, rgba(255, 60, 158, 0.9) 21.5% 24%, transparent 24.5% 49%, rgba(255, 60, 158, 0.7) 49.5% 53%, transparent 53.5% 83%, rgba(255, 60, 158, 0.9) 83.5% 86%, transparent 86.5%),
  repeating-linear-gradient(0deg, transparent 0 7px, rgba(255, 60, 158, 0.8) 8px 11px, transparent 12px 18px);
animation: activation-out-magenta 0.13s steps(2, end) infinite;
}

.secret-activation.active.short-mode.item-unlock-shaking::before {
display: block;
inset: 0;
z-index: 1;
background: radial-gradient(circle at 50% 45%, rgba(101, 255, 143, 0.22), transparent 55%);
animation: item-screen-shake 0.075s linear infinite;
}

.secret-activation.glitch-out .secret-activation-title {
display: none;
}

.secret-activation.show-terminal .secret-activation-title {
animation: activation-title-to-terminal 0.3s steps(1, end) both;
}

.secret-activation-title::before,
.secret-activation-title::after {
position: absolute;
inset: 0;
content: attr(data-text);
overflow: hidden;
pointer-events: none;
}

.secret-activation-title::before {
color: #ff3c9e;
transform: translate(-5px, 1px);
clip-path: inset(0 0 42% 0);
text-shadow: 0 0 12px rgba(255, 60, 158, 0.9);
animation: activation-glitch-top 0.19s steps(2, end) infinite;
}

.secret-activation-title::after {
color: #38e8ff;
transform: translate(5px, -1px);
clip-path: inset(46% 0 0 0);
text-shadow: 0 0 12px rgba(56, 232, 255, 0.9);
animation: activation-glitch-bottom 0.14s steps(2, end) infinite;
}

.secret-terminal {
display: none;
width: 100%;
min-height: 0;
flex: 1 1 auto;
margin: 0;
overflow: auto;
color: #65ff8f;
font: 11px/1.4 monospace;
text-shadow: 0 0 5px rgba(101, 255, 143, 0.35);
white-space: pre-wrap;
overflow-wrap: anywhere;
}

.secret-activation.show-terminal .secret-terminal {
display: block;
animation: terminal-flicker-in 0.55s steps(1, end) both;
}

@media (max-width: 600px) {
.secret-terminal {
font-size: 10px;
}
}

.secret-terminal::after {
content: "█";
animation: terminal-caret 0.8s steps(2, end) infinite;
}

@keyframes activation-screen-in {
from { opacity: 0; }
to { opacity: 1; }
}

@keyframes item-screen-shake {
0%, 100% { transform: translate(0, 0); }
20% { transform: translate(-7px, 4px); }
40% { transform: translate(6px, -5px); }
60% { transform: translate(-5px, -3px); }
80% { transform: translate(7px, 5px); }
}

@keyframes item-title-boom {
0% { opacity: 0; transform: translate(-50%, -50%) scale(0.12); filter: blur(12px); }
65% { opacity: 1; transform: translate(-50%, -50%) scale(1.18); filter: blur(0); }
82% { transform: translate(-50%, -50%) scale(0.94); }
100% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
}

@keyframes item-code-fade-out {
from { opacity: 1; transform: scale(1); }
to { opacity: 0; transform: scale(0.9); }
}

@keyframes item-title-pan-up {
from { transform: translate(-50%, -50%); }
to { transform: translate(-50%, calc(-50% - 22vh)); }
}

@keyframes item-reward-fade-in {
from { opacity: 0; transform: translate(-50%, 24px) scale(0.94); }
to { opacity: 1; transform: translate(-50%, 0) scale(1); }
}

@keyframes terminal-caret {
to { visibility: hidden; }
}

@keyframes activation-title-to-terminal {
0% { opacity: 1; clip-path: inset(0); transform: translate(0); }
30% { opacity: 0.35; clip-path: inset(42% 0 38%); transform: translate(-8px, 1px); }
55% { opacity: 1; clip-path: inset(12% 0 65%); transform: translate(6px, -2px); }
100% { opacity: 0; clip-path: inset(50% 0 50%); transform: translate(0); }
}

@keyframes terminal-flicker-in {
0% { opacity: 0; transform: translateX(8px); }
18% { opacity: 1; transform: translateX(-3px); }
32% { opacity: 0.2; transform: translateX(4px); }
48% { opacity: 1; transform: translateX(-2px); }
63% { opacity: 0.45; transform: translateX(2px); }
78%, 100% { opacity: 1; transform: translateX(0); }
}

@keyframes activation-title-flicker {
0%, 100% { text-shadow: 0 0 12px rgba(101, 255, 143, 0.7); }
35% { text-shadow: 0 0 20px rgba(101, 255, 143, 1), 2px 0 #ff3c9e, -2px 0 #38e8ff; }
38% { text-shadow: 0 0 5px rgba(101, 255, 143, 0.5); }
72% { text-shadow: 0 0 18px rgba(101, 255, 143, 0.95), -2px 0 #ff3c9e, 2px 0 #38e8ff; }
}

@keyframes activation-glitch-top {
0%, 28%, 31%, 100% { clip-path: inset(0 0 42% 0); transform: translate(-3px, 1px); }
29% { clip-path: inset(8% 0 67% 0); transform: translate(7px, -2px); }
30% { clip-path: inset(34% 0 39% 0); transform: translate(-6px, 2px); }
63% { clip-path: inset(12% 0 28% 0); transform: translate(-5px, -1px); }
64% { clip-path: inset(4% 0 38% 0); transform: translate(6px, 2px); }
}

@keyframes activation-glitch-bottom {
0%, 20%, 23%, 100% { clip-path: inset(46% 0 0 0); transform: translate(3px, -1px); }
21% { clip-path: inset(61% 0 15% 0); transform: translate(-6px, 2px); }
22% { clip-path: inset(43% 0 36% 0); transform: translate(6px, -2px); }
71% { clip-path: inset(58% 0 12% 0); transform: translate(5px, 1px); }
72% { clip-path: inset(42% 0 18% 0); transform: translate(-6px, -2px); }
}

@keyframes activation-glitch-exit {
0%, 100% { background-color: #000; opacity: 1; }
5% { background-color: rgba(56, 232, 255, 0.38); }
11% { background-color: #000; }
18% { background-color: rgba(255, 60, 158, 0.4); }
24% { background-color: #000; }
31% { background-color: rgba(56, 232, 255, 0.3); }
37% { background-color: #000; }
44% { background-color: rgba(255, 60, 158, 0.42); }
50% { background-color: #000; }
57% { background-color: rgba(56, 232, 255, 0.36); }
63% { background-color: #000; }
70% { background-color: rgba(255, 60, 158, 0.38); }
76% { background-color: #000; }
83% { background-color: rgba(56, 232, 255, 0.4); }
89% { background-color: #000; }
94% { background-color: rgba(255, 60, 158, 0.45); }
98% { background-color: #000; }
}

@keyframes activation-glitch-slices {
0% { transform: translate(-5%, -3%); clip-path: inset(7% 0 80% 0); opacity: 0.5; }
18% { transform: translate(6%, 1%); clip-path: inset(31% 0 57% 0); opacity: 1; }
37% { transform: translate(-4%, 2%); clip-path: inset(67% 0 24% 0); opacity: 0.65; }
55% { transform: translate(5%, -2%); clip-path: inset(17% 0 70% 0); opacity: 1; }
76% { transform: translate(-6%, 3%); clip-path: inset(53% 0 35% 0); opacity: 0.75; }
100% { transform: translate(4%, -1%); clip-path: inset(82% 0 5% 0); opacity: 1; }
}

@keyframes activation-out-cyan {
0%, 100% { transform: translate(-2vw, -1vh) skewX(-4deg) scaleX(1.04); clip-path: inset(0); opacity: 0.8; filter: hue-rotate(0deg) contrast(2); }
8% { transform: translate(2vw, 1vh) skewX(5deg) scaleX(0.96); clip-path: inset(8% 0 72% 0); opacity: 1; filter: hue-rotate(35deg) contrast(3); }
16% { transform: translate(-1vw, -2vh) skewX(-2deg) scaleX(1.08); clip-path: inset(0); opacity: 0.45; filter: hue-rotate(-20deg) contrast(2.5); }
25% { transform: translate(3vw, 0) skewX(6deg) scaleX(0.92); clip-path: inset(38% 0 42% 0); opacity: 1; filter: hue-rotate(55deg) contrast(3); }
34% { transform: translate(-3vw, 2vh) skewX(-5deg) scaleX(1.06); clip-path: inset(0); opacity: 0.7; filter: hue-rotate(0deg) contrast(2.2); }
43% { transform: translate(1vw, -1vh) skewX(3deg) scaleX(0.94); clip-path: inset(74% 0 8% 0); opacity: 1; filter: hue-rotate(-35deg) contrast(3); }
52% { transform: translate(-2.5vw, 1vh) skewX(-6deg) scaleX(1.1); clip-path: inset(0); opacity: 0.5; filter: hue-rotate(45deg) contrast(2.6); }
61% { transform: translate(2.5vw, -2vh) skewX(4deg) scaleX(0.9); clip-path: inset(19% 0 64% 0); opacity: 1; filter: hue-rotate(0deg) contrast(3); }
70% { transform: translate(-1vw, 2vh) skewX(-3deg) scaleX(1.05); clip-path: inset(0); opacity: 0.65; filter: hue-rotate(-45deg) contrast(2.4); }
80% { transform: translate(3vw, -1vh) skewX(6deg) scaleX(0.95); clip-path: inset(52% 0 32% 0); opacity: 1; filter: hue-rotate(35deg) contrast(3); }
90% { transform: translate(-2vw, 1vh) skewX(-5deg) scaleX(1.08); clip-path: inset(0); opacity: 0.55; filter: hue-rotate(0deg) contrast(2.8); }
}

@keyframes activation-out-magenta {
0%, 100% { transform: translate(2vw, 1vh) skewX(5deg) scaleX(0.94); clip-path: inset(0); opacity: 0.75; filter: hue-rotate(0deg) contrast(2.4); }
11% { transform: translate(-3vw, -1vh) skewX(-4deg) scaleX(1.08); clip-path: inset(68% 0 12% 0); opacity: 1; filter: hue-rotate(-45deg) contrast(3); }
22% { transform: translate(1vw, 2vh) skewX(3deg) scaleX(0.92); clip-path: inset(0); opacity: 0.45; filter: hue-rotate(30deg) contrast(2); }
34% { transform: translate(-2.5vw, 0) skewX(-6deg) scaleX(1.1); clip-path: inset(12% 0 71% 0); opacity: 1; filter: hue-rotate(0deg) contrast(3); }
46% { transform: translate(3vw, -2vh) skewX(4deg) scaleX(0.96); clip-path: inset(0); opacity: 0.65; filter: hue-rotate(55deg) contrast(2.5); }
58% { transform: translate(-1vw, 1vh) skewX(-3deg) scaleX(1.06); clip-path: inset(42% 0 40% 0); opacity: 1; filter: hue-rotate(-25deg) contrast(3); }
70% { transform: translate(2.5vw, -1vh) skewX(5deg) scaleX(0.92); clip-path: inset(0); opacity: 0.5; filter: hue-rotate(40deg) contrast(2.6); }
82% { transform: translate(-2vw, 2vh) skewX(-5deg) scaleX(1.05); clip-path: inset(78% 0 5% 0); opacity: 1; filter: hue-rotate(0deg) contrast(3); }
92% { transform: translate(1vw, -2vh) skewX(4deg) scaleX(0.95); clip-path: inset(0); opacity: 0.7; filter: hue-rotate(-35deg) contrast(2.4); }
}

@media (prefers-reduced-motion: reduce) {
.secret-activation-title,
.secret-activation-title::before,
.secret-activation-title::after,
.secret-activation.active:not(.show-terminal),
.secret-activation.show-terminal .secret-activation-title,
.secret-activation.show-terminal .secret-terminal {
animation: none;
}
.secret-activation.glitch-out::before,
.secret-activation.glitch-out::after,
.secret-activation.active:not(.show-terminal)::before,
.secret-activation.active:not(.show-terminal)::after {
animation: none;
}
}

@media (prefers-reduced-motion: reduce) {
.secret-activation.item-unlock-shaking,
.secret-activation.item-unlock-shaking::before,
.secret-activation.active.short-mode .secret-activation-title.item-code-fade,
.item-unlock-title.boom-in,
.item-unlock-title.pan-up,
.item-reward.reveal,
.item-reward-image.rarity-glow {
animation: none;
}
}

@font-face {
font-family: 'facon';
src: url('assets/facon.ttf') format('truetype');
}

.switch {
position: relative;
display: inline-block;
width: 60px;
height: 34px;
}

.switch input {
opacity: 0;
width: 0;
height: 0;
}

.slider {
position: absolute;
cursor: pointer;
top: 0;
left: 0;
right: 0;
bottom: 0;
background-color: #ccc;
-webkit-transition: .4s;
transition: .4s;
}

.slider:before {
position: absolute;
content: "";
height: 26px;
width: 26px;
left: 4px;
bottom: 4px;
background-color: white;
-webkit-transition: .4s;
transition: .4s;
}

input:checked + .slider {
background-color: #2196F3;
}

input:focus + .slider {
box-shadow: 0 0 1px #2196F3;
}

input:checked + .slider:before {
-webkit-transform: translateX(26px);
-ms-transform: translateX(26px);
transform: translateX(26px);
}

/* Rounded sliders */
.slider.round {
border-radius: 34px;
}

.slider.round:before {
border-radius: 50%;
}

.title {
font-size: 50pt;
font-family: 'facon', sans-serif;
letter-spacing: 3pt;
}

.tile {
color: var(--nc-tx-1);
height: auto;
width: auto;
border-radius: 10px;
border: 1px solid var(--nc-tx-1);
text-align: center;
position: relative;
float: left;
margin: 20px;
}

.tile img {
width: 200px;
height: 200px;
border-radius: 10px;
}

.tile:hover {
font-weight: bold;
cursor: pointer;
background: var(--nc-bg-3);
}

.collection-tabs {
display: flex;
gap: 8px;
margin: 20px;
}

.collection-tabs button[aria-selected="true"] {
font-weight: bold;
}

.items-unlocked-hint {
margin: 0 20px;
color: #65ff8f;
font: bold 1rem monospace;
}

.items-unlocked-hint[hidden] {
display: none;
}

.items-unlocked-hint.fade-in {
animation: items-hint-fade-in 0.9s ease-out both;
}

@keyframes items-hint-fade-in {
from { opacity: 0; transform: translateY(8px); }
to { opacity: 1; transform: translateY(0); }
}

.item-reward {
position: absolute;
top: 50%;
left: 50%;
display: flex;
flex-direction: column;
align-items: center;
gap: 12px;
transform: translateX(-50%);
color: #65ff8f;
font: bold clamp(1.2rem, 4vw, 2rem) monospace;
text-align: center;
}

.item-reward[hidden] {
display: none;
}

.item-reward img {
max-width: min(60vw, 240px);
max-height: 30vh;
object-fit: contain;
}

.item-rarity {
margin: 0;
font: bold 0.85em monospace;
}

.item-rarity-common {
color: #39d353;
}

.item-rarity-rare {
color: #38aaff;
}

.item-rarity-epic {
color: #c77dff;
}

.item-rarity-legendary {
color: #ffd447;
}

.item-rarity-mythic {
color: #ff4d5e;
}

.item-rarity-common.rarity-glow {
--rarity-glow: #39d353;
}

.item-rarity-rare.rarity-glow {
--rarity-glow: #38aaff;
}

.item-rarity-epic.rarity-glow {
--rarity-glow: #c77dff;
}

.item-rarity-legendary.rarity-glow {
--rarity-glow: #ffd447;
}

.item-rarity-mythic.rarity-glow {
--rarity-glow: #ff4d5e;
}

.shade {
opacity: 0.7;
background-color: var(--nc-bg-3);
position: fixed;
width: 100%;
height: 100vh;
top: 0px;
left: 0px;
z-index: 100;
display: block;
}

.cont {
opacity: 1;
color: var(--nc-tx-1);
background-color: var(--nc-bg-3);
z-index: 1000;
width: calc(100vw - 70px);
height: calc(100vh - 70px);
border-radius: 10px;
text-align: center;
position: fixed;
left: 50%;
top: 50%;
transform: translateX(-50%) translateY(-50%);
}

.loader{
position: fixed;
border:16px solid var(--nc-bg-3);
border-radius:50%;
border-top:16px solid var(--nc-lk-2);
width:120px;
height:120px;
top: 0;
right: 0;
margin: 10px;
animation:spin 2s linear infinite;
transform: translateX(-50%) translateY(-50%);
}

@keyframes spin{
0%{transform:rotate(0deg)}
100%{transform:rotate(360deg)}
}
</style>
<script src='i.js'></script>
</head>

<body onload="setSavedTheme()">
<div id="secretActivation" class="secret-activation" aria-hidden="true">
  <h1 class="secret-activation-title" data-text="SECRET GAME ACTIVATED">SECRET GAME ACTIVATED</h1>
  <div id="secretItemRevealStage" class="item-reveal-stage" hidden>
    <h2 id="secretItemUnlockedTitle" class="item-unlock-title">ITEM UNLOCKED</h2>
    <div id="secretItemReward" class="item-reward" hidden>
      <p id="secretItemRewardName"></p>
      <p id="secretItemRewardRarity" class="item-rarity"></p>
      <img id="secretItemRewardImage" alt="">
    </div>
  </div>
  <pre id="secretTerminal" class="secret-terminal" aria-live="polite"></pre>
</div>
<audio id="secretSoundOne" src="before.mp3" preload="auto"></audio>
<audio id="secretSoundTwo" src="after.mp3" preload="auto"></audio>
<audio id="secretSoundThree" src="after_after.mp3" preload="auto"></audio>
<audio id="itemCodeActivatedSound" src="g/g/game 12364/sounds/cheat-code-unlocked.mp3" preload="auto"></audio>
<audio id="itemRevealSound" src="g/g/game 12364/sounds/item-reveal.mp3" preload="auto"></audio>
<audio id="itemGlowSound" src="g/g/game 12364/sounds/rarity-glow.mp3" preload="auto"></audio>

<header>
<h1 class="title">HollowGames</h1>
</header>

<label>Dark Mode:</label>
<label class="switch">
<input id="darkModeInput" type="checkbox" checked oninput="changeTheme(this)">
<span class="slider round"></span>

function getOwnedItems() {

}

// The registry file only contains PBKDF2 hashes of the cheat codes, never the codes.
// These parameters must match hash-registry.js.
var CODE_HASH_SALT = 'hollow-cheat-registry-v1';
var CODE_HASH_ITERATIONS = 100000;
var codeHashCache = Object.create(null);

function hashSecretCode(code) {
  code = code.trim().toLowerCase();
  if (Object.prototype.hasOwnProperty.call(codeHashCache, code)) return codeHashCache[code];
  if (!window.crypto || !window.crypto.subtle) {
    return Promise.reject(new Error('Web Crypto is unavailable (the page must be served over HTTPS)'));
  }
  var encoder = new TextEncoder();
  var promise = window.crypto.subtle.importKey('raw', encoder.encode(code), 'PBKDF2', false, ['deriveBits'])
    .then(function(key) {
      return window.crypto.subtle.deriveBits({
        name: 'PBKDF2',
        salt: encoder.encode(CODE_HASH_SALT),
        iterations: CODE_HASH_ITERATIONS,
        hash: 'SHA-256'
      }, key, 256);
    })
    .then(function(bits) {
      return Array.prototype.map.call(new Uint8Array(bits), function(byte) {
        return ('0' + byte.toString(16)).slice(-2);
      }).join('');
    });
  codeHashCache[code] = promise;
  return promise;
}

function checkSecretCode(secretCode) {
  if (!secretCodeRegistryReady || !secretCode) return;
  hashSecretCode(secretCode).then(function(hash) {
    var searchInput = l('searchQuery');
    // Ignore the result if the visitor kept typing while the hash was computed.
    if (!searchInput || searchInput.value.trim().toLowerCase() !== secretCode) return;
    if (Object.prototype.hasOwnProperty.call(secretCodeDestinations, hash)) {
      activateSecretDestination(secretCode, secretCodeDestinations[hash]);
    }
  }).catch(function(error) {
    console.error('Unable to check cheat code:', error);
  });
}

      return Object.prototype.hasOwnProperty.call(secretCodeDestinations, hash) &&
        secretCodeDestinations[hash].item !== null ? item : null;
    });

function loadSecretCodeRegistry() {
  fetch('g/g/game12364/12364.json', { cache: 'no-cache' })
    .then(function(response) {
      if (!response.ok) {
        throw new Error('HTTP ' + response.status + ' while loading the secret-code registry');
      }
      return response.json();
    })
    .then(function(registry) {
      if (!registry || typeof registry !== 'object' || Array.isArray(registry)) {
        throw new Error('The secret-code registry must be a JSON object mapping code names to destinations and cinematic modes');
      }

      var destinations = Object.create(null);
      Object.keys(registry).forEach(function(code) {
        var entry = registry[code];
        var isItem = typeof entry !== 'string' && entry && entry.item === true;
        var html = typeof entry === 'string' ? entry : entry && entry.destination;
        var cinematic = typeof entry === 'string'
          ? 'long'
          : entry && entry.cinematic !== undefined ? entry.cinematic : 'long';
        if (typeof entry !== 'string' && entry && entry.item !== undefined && typeof entry.item !== 'boolean') {
          throw new Error('Item flag for cheat code "' + code + '" must be true or false');
        }

        if (!isItem && typeof html !== 'string') {
          throw new Error('Destination for cheat code "' + code + '" must be a string');
        }

        var name = code.trim().toLowerCase();
        if (!/^[0-9a-f]{64}$/.test(name)) {
          throw new Error('Registry keys must be 64-character hex hashes (run hash-registry.js on the plaintext registry)');
        }
        if (!name || (!isItem && !html.trim())) {
          throw new Error('Cheat code names and destinations cannot be empty');
        }
        if (cinematic !== 'short' && cinematic !== 'long') {
          throw new Error('Cinematic for cheat code "' + name + '" must be "short" or "long"');
        }

        var itemConfig = null;
        if (isItem) {
          var itemName = typeof entry.itemName === 'string'
            ? entry.itemName.trim()
            : typeof entry.name === 'string' ? entry.name.trim() : '';
          var rarity = typeof entry.rarity === 'string' ? entry.rarity.trim().toLowerCase() : '';
          var rarities = {
            common: 'Common',
            rare: 'Rare',
            epic: 'Epic',
            legendary: 'Legendary',
            mythic: 'Mythic'
          };
          if (!itemName || typeof entry.image !== 'string' || !entry.image.trim() || !rarities[rarity]) {
            throw new Error('Item cheat code "' + name + '" must provide itemName, a supported rarity, and an image path');
          }
          var itemImage = new URL(entry.image.trim(), window.location.href);
          if (itemImage.protocol !== 'http:' && itemImage.protocol !== 'https:') {
            throw new Error('Image for item cheat code "' + name + '" must use HTTP or HTTPS');
          }
          itemConfig = {
            itemName: itemName,
            image: entry.image.trim(),
            rarity: rarities[rarity]
          };
        } else {
          html = html.trim();
          var target = new URL(html, window.location.href);
          if (target.origin !== window.location.origin || !/\.html$/i.test(target.pathname)) {
            throw new Error('Destination for cheat code "' + name + '" must be a same-site HTML page');
          }
        }
        if (Object.prototype.hasOwnProperty.call(destinations, name)) {
          throw new Error('Duplicate cheat code name: ' + name);
        }

        destinations[name] = {
          destination: isItem ? null : html,
          cinematic: cinematic,
          item: itemConfig
        };
      });

      secretCodeDestinations = destinations;
      secretCodeRegistryReady = true;
      renderOwnedItems();
      if (l('searchQuery')) startSearch();
    })
    .catch(function(error) {
      console.error('Unable to load registered cheat codes:', error);
    });
}

function animateLaunchDots() {
  var terminal = l('secretTerminal');
  var launchLineStart = terminal.textContent.lastIndexOf(launchMessage);
  var dotFrames = ['.', '..', '...'];
  var progress = 0;

  function updateLaunchProgress() {
    var filled = Math.floor(progress / 10);
    var progressBar = '#'.repeat(filled) + '-'.repeat(10 - filled);
    var dotFrame = dotFrames[progress % dotFrames.length];
    terminal.textContent = terminal.textContent.slice(0, launchLineStart) +
      launchMessage + dotFrame + '\n' +
      '[' + progressBar + '] ' + progress + '%' +
      (progress >= 100 ? '\nInstallation complete\n' : '\n');
    terminal.scrollTop = terminal.scrollHeight;

    if (progress === 90) {
      soundThree.currentTime = 0;
      playSecretSound(soundThree);
    }

    if (progress >= 100) {
      activation.classList.add('glitch-out');
      var glitchStartedAt = performance.now();
      setTimeout(function() {
        clearInterval(titleGlitchInterval);
        activation.classList.add('handoff-flash');
        var destinationUrl = new URL(destination, window.location.href);
        if (destinationUrl.pathname === '/Settings.html') {
          destinationUrl.searchParams.set('__glitchArrival', '1');
          destinationUrl.searchParams.set(
            '__glitchElapsed',
            String(Math.round(performance.now() - glitchStartedAt))
          );
          destinationUrl.searchParams.set(
            '__glitchSoundTime',
            String(soundThree.currentTime)
          );
        }
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            window.location.href = destinationUrl.href;
          });
        });
      }, 300);
      return;
    }

    progress += 10;
    setTimeout(updateLaunchProgress, 250);
  }

  updateLaunchProgress();
}

function getStoredJSON(key, data) {
if (data && data.key && (localStorage[key] != 'null')) {
var inStore = JSON.parse(localStorage[key]);
if ((typeof inStore == 'object') && inStore.hasOwnProperty(data.key)) {
return inStore[data.key];
}
}
if (localStorage[key] && !data) {
return JSON.parse(localStorage[key]);
}
return null;
}

function storeJSON(key, data) {
if (localStorage[key]) {
var inStore = JSON.parse(localStorage[key]) || {};
inStore[data.key] = data.value;
localStorage[key] = JSON.stringify(inStore);
}else{
var inStore = {};
inStore[data.key] = data.value;
localStorage[key] = JSON.stringify(inStore);
}

return localStorage[key];
}

}
}
}
